name: WarmSip CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npm run secret:scan
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npm run server:build
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run audit:prod

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 2

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build service image
        run: docker build --pull -t warmsip-service:test .
      - name: Start service with encrypted credential store
        run: |
          docker run --rm -d --name warmsip-ci \
            -p 127.0.0.1:8787:8787 \
            -e SERVICE_ACCESS_TOKEN=warmsip-ci-access-token-1234 \
            -e AI_CREDENTIAL_ENCRYPTION_KEY=warmsip-ci-encryption-key-1234 \
            -e ALLOWED_ORIGINS=http://localhost:1420 \
            warmsip-service:test
      - name: Verify health and authentication boundary
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8787/api/v1/ai/state)" = "401"
          curl --fail --silent \
            -H 'Authorization: Bearer warmsip-ci-access-token-1234' \
            http://127.0.0.1:8787/api/v1/ai/state > /dev/null
      - if: always()
        run: docker rm -f warmsip-ci
