name: WarmSip CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npm run server:build
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run audit:prod

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build --pull -t warmsip-service:test .
      - name: Start service with encrypted credential store
        run: |
          docker run --rm -d --name warmsip-ci \
            -p 127.0.0.1:8787:8787 \
            -e SERVICE_ACCESS_TOKEN=warmsip-ci-access-token-1234 \
            -e AI_CREDENTIAL_ENCRYPTION_KEY=warmsip-ci-encryption-key-1234 \
            -e ALLOWED_ORIGINS=http://localhost:1420 \
            warmsip-service:test
      - name: Verify health and authentication boundary
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8787/api/v1/ai/state)" = "401"
          curl --fail --silent \
            -H 'Authorization: Bearer warmsip-ci-access-token-1234' \
            http://127.0.0.1:8787/api/v1/ai/state > /dev/null
      - if: always()
        run: docker rm -f warmsip-ci
