[package]
name = "warmsip"
version = "0.1.0"
description = "WarmSip — Send a Little Warmth"
authors = ["YUHUANGSHANDIAN"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
name = "warmsip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
